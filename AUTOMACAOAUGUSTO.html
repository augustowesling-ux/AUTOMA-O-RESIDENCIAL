<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Automação Completo</title>
    
    <!-- Biblioteca MQTT Paho Oficial via CDN (Essencial para rodar o MQTT no navegador) -->
    <script src="https://cloudflare.com" type="text/javascript"></script>
    
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-secondary: #666666;
            --primary-color: #4a90e2;
            --accent-on: #2ecc71;
            --accent-off: #e74c3c;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-color: #ffffff;
                --text-secondary: #b0b0b0;
            }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--card-bg);
            padding-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        h2 {
            margin: 0 0 15px 0;
            font-size: 20px;
            color: var(--primary-color);
            grid-column: 1 / -1;
        }

        .status-geral {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .section-block {
            margin-bottom: 35px;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .disp-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .ac-card {
            flex-direction: column;
            align-items: stretch;
            gap: 15px;
        }

        .ac-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ac-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(0,0,0,0.03);
            padding: 10px 15px;
            border-radius: 10px;
        }

        @media (prefers-color-scheme: dark) {
            .ac-controls {
                background-color: rgba(255,255,255,0.05);
            }
        }

        .ac-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ac-btn:active {
            opacity: 0.8;
        }

        .ac-temp-display {
            font-size: 24px;
            font-weight: bold;
        }

        .disp-info h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
        }

        .disp-status {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
        }

        .status-ligado {
            background-color: rgba(46, 204, 113, 0.1);
            color: var(--accent-on);
        }

        .status-desligado {
            background-color: rgba(231, 76, 60, 0.1);
            color: var(--accent-off);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-on);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }
    </style>
</head>
<body>

        <header>
            <div>
                <h1>Controle Residencial Integrado</h1>
                <div class="status-geral">Broker: <strong id="mqtt-status" style="color: var(--accent-off);">Conectando...</strong></div>
            </div>
            <div id="data-hora">--:--</div>

                    <div class="ac-controls">

                        <div class="ac-temp-display"><span id="temp-ar">22</span>°C</div>
                        <button class="ac-btn" onclick="alterarTemperatura(1)">+</button>
                    </div>
                </div>
            </div>
        </div>

                    </div>
                    <label class="switch">
                        <input type="checkbox" id="check-luz-garagem" onchange="publicarComando('casa/luz/garagem', this.checked ? '1' : '0')">
                        <span class="slider"></span>
                    </label>
                </div>

                <!-- Banheiro -->
                <div class="disp-card" id="card-luz-banheiro">

                        <h3>Luz do Banheiro</h3>
                        <span class="disp-status status-desligado" id="status-luz-banheiro">Desligado</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="check-luz-banheiro" onchange="publicarComando('casa/luz/banheiro', this.checked ? '1' : '0')">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="disp-card" id="card-luz-quarto">
                    <div class="disp-info">
                        <h3>Luz do Quarto</h3>
                        <span class="disp-status status-desligado" id="status-luz-quarto">Desligado</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="check-luz-quarto" onchange="publicarComando('casa/luz/quarto', this.checked ? '1' : '0')">
                        <span class="slider"></span>
                    </label>
                </div>

                <!-- Cozinha -->
                <div class="disp-card" id="card-luz-cozinha">
                    <div class="disp-info">
                        <h3>Luz da Cozinha</h3>
                        <span class="disp-status status-desligado" id="status-luz-cozinha">Desligado</span>
                    </div>
